<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill of Skills · 任务路线</title></head><body>
<!-- WIDGET_START -->
<style>
.sos{--ink:#30263d;--muted:#80728b;--line:#e8e0ee;--accent:#77519d;--paper:#fff;color:var(--ink);font:14px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif;max-width:980px;margin:auto;padding:8px 16px;background:linear-gradient(145deg,#faf7fd 0%,#fff 48%,#fdf6fa 100%);border-radius:20px}
.sos *{box-sizing:border-box}
.sos button,.sos input,.sos textarea,.sos select{font:inherit}
.sos button{cursor:pointer;color:inherit;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px}
.sos button:hover{border-color:var(--accent);background:#f6effa}
.sos button:disabled{cursor:default;opacity:.55}
.sos .primary{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 3px 8px #77519d18}
.sos .primary:hover{background:#644184;border-color:#644184;color:white}
.sos :focus-visible{outline:2px solid #a17cbe;outline-offset:3px}
.sos .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.sos h1{font-size:17px;font-weight:600;line-height:1.4;margin:0;flex:1;min-width:160px}
.sos .version{color:var(--muted);font-size:12px}
.sos .tools{display:flex;flex-wrap:wrap;gap:6px}
.sos .hint{font-size:12px;color:var(--muted);margin:9px 0}
.sos .canvas{position:relative;padding:24px 4px;overflow:auto}
.sos .flow{position:relative;display:flex;flex-direction:column;gap:34px;min-width:0}
.sos .row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative;z-index:1}
.sos .node{position:relative;flex:0 1 300px;min-width:200px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px 42px 15px 16px;outline-offset:3px}
.sos .node:hover,.sos .node:focus-within{border-color:#b99acb;background:#fcf9fe}
.sos .node.deleted{opacity:.55;border-style:dashed}
.sos .node.deleted strong{text-decoration:line-through}
.sos .node small{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.sos .node strong{display:block;font-size:15px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sos .pencil{position:absolute;right:8px;top:9px;width:29px;height:29px;padding:5px;border-color:transparent;background:transparent}
.sos .pencil svg{width:16px;height:16px;display:block}
.sos .outline-list{margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--line);display:grid;gap:5px}
.sos .outline-item{display:block;width:100%;text-align:left;font-size:12px;padding:5px 7px;line-height:1.5}
.sos .binding{margin-top:8px;font-size:12px;overflow-wrap:anywhere}
.sos .status{display:inline-block;border-radius:5px;padding:1px 5px;margin-left:4px;background:#f1eafa;color:#6c488f;font-size:11px}
.sos .status.pending{background:#f8eaf1;color:#96516f}
.sos .edges{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.sos .notice{font-size:12px;line-height:1.5;color:var(--muted);padding:8px 0;white-space:pre-wrap}
.sos .notice.error{color:#a1385e}
.sos .bottom{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sos .bottom .hint{flex:1;margin:0}
.sos .tip{padding:8px 22px 24px;font-size:13px;line-height:1.7}
.sos .tip h2{font-size:15px;margin:0 0 10px;font-weight:600}
.sos .tip p{margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.sos .tip b{font-weight:600}
.sos [hidden]{display:none!important}
.sos dialog{color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:88vh;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0;overflow:auto}
.sos dialog::backdrop{background:#30203f4d}
.sos .modal-head{position:sticky;top:0;z-index:2;background:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.sos h2{font-size:17px;font-weight:600;margin:0}
.sos .modal-body{padding:4px 20px 20px}
.sos label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.sos input,.sos textarea,.sos select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;color:var(--ink);background:#fdfbfe}
.sos textarea{min-height:75px;resize:vertical}
.sos .dep{display:flex;gap:8px;align-items:center;margin:7px 0;color:var(--ink)}
.sos .dep input{width:auto}
.sos .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.sos .danger{color:#a1385e}
.sos .bind-edit{border:1px solid var(--line);padding:10px;border-radius:8px;margin:12px 0}
.sos summary{cursor:pointer;color:var(--accent);font-size:12px;margin:14px 0}
.sos .details-list{font-size:13px}
.sos .error-text{font-size:12px;color:#a1385e;white-space:pre-wrap}
.sos #extraTools{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:520px){.sos .bar{align-items:flex-start}
.sos h1{flex-basis:100%;font-size:16px}
.sos .node{flex-basis:100%;max-width:350px}
.sos .canvas{padding:20px 2px}

.sos .tools button{font-size:12px}
}
@media print{.sos .tools,.sos .bottom,.sos .pencil,.sos .notice,.sos .hint,.sos .tip{display:none!important}
.sos .node{break-inside:avoid}
}


.sos .node{flex-basis:440px;max-width:500px;border-radius:16px;padding:20px 22px;background:#fff;box-shadow:0 3px 14px #56347308}
.sos .node strong{font-size:17px;padding-right:20px}
.sos .node small{letter-spacing:.04em;margin-bottom:9px}
.sos .node:hover{background:#fff}
.sos .binding{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:12px}
.sos .skill-name{font-size:12px;color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.sos a:hover{text-decoration:underline}
.sos .status{margin:0;padding:3px 7px;border-radius:6px;white-space:nowrap}
.sos .node-footer{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sos .stage-question{font-size:13px;line-height:1.65;color:var(--muted);margin:10px 0;overflow-wrap:anywhere}
.sos .output-summary{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sos .detail-button{font-size:12px;white-space:nowrap;border:0;padding:5px 0;color:var(--accent);background:transparent}
.sos #detailDialog{width:min(620px,calc(100vw - 24px));box-shadow:0 18px 80px #4c2b6830}
.sos .tip .skill-detail{background:#f8f3fb;border-radius:10px;padding:14px 16px;margin:12px 0}
.sos .skill-detail>a{display:block;margin:12px 0}
.sos .tip h3{font-size:13px;margin:16px 0 8px}
.sos .tip ul{padding-left:20px}
.sos .tip li{margin:6px 0}
.sos .detail-tabs{display:flex;gap:6px;margin:10px 0 18px;padding:4px;background:#f4eff7;border-radius:10px}
.sos .detail-tabs button{flex:1;border:0;background:transparent;font-size:12px;padding:8px}
.sos .detail-tabs button[aria-pressed="true"]{background:white;box-shadow:0 1px 5px #57306b12;color:var(--accent);font-weight:600}
.sos .tip a{color:var(--accent);font-weight:600}
.sos .modal-head button{font-size:20px;line-height:1;border:0}
@media(max-width:520px){.sos .node{max-width:none;padding:18px}.sos .node strong{font-size:16px}.sos .node-footer{align-items:flex-start}.sos .bar{padding:12px 0}.sos dialog{max-height:90vh}}

</style>
<div class="sos" id="sos-root">
 <div class="bar"><h1 id="title">任务路线</h1><span id="version" class="version"></span><div class="tools"><button id="persist" class="primary">保存修改</button><button id="requirementsButton">调整需求</button><button id="moreButton" aria-label="更多选项">···</button></div></div>
 <div id="extraTools" hidden><button id="save">导出备份</button><button id="import">导入方案</button><button id="print">打印</button><button id="add">添加模块</button></div>
 <p class="hint">点击查看详情 · 铅笔编辑模块 · 保存后在对话中确认执行</p>
 <p id="routeReason" class="hint" hidden></p>
 <p id="readiness" class="notice" role="status"></p>
 <div class="canvas"><div id="flow" class="flow"></div></div>
 <div id="notice" class="notice" role="status" aria-live="polite"></div>
 <div class="bottom" id="handoff"><span id="syncState" class="hint"></span></div>
 <dialog id="detailDialog" aria-labelledby="detailTitle"><div class="modal-head"><h2 id="detailTitle">模块详情</h2><button data-close="detailDialog" aria-label="关闭模块详情">×</button></div><div id="tip" class="tip"></div></dialog>
 <dialog id="nodeDialog" aria-labelledby="editorTitle"><div class="modal-head"><h2 id="editorTitle">编辑模块</h2><button data-close="nodeDialog" aria-label="关闭模块编辑">×</button></div><div class="modal-body"><label for="ntitle">模块名称</label><input id="ntitle"><label for="description">工作说明</label><textarea id="description"></textarea><label for="reason">安排理由</label><textarea id="reason"></textarea><label for="method">执行方式</label><select id="method"><option value="direct">原生能力</option><option value="skill">调用技能</option><option value="human">用户判断</option></select><label>需要先完成的模块</label><div id="deps"></div><label for="done">完成标准 · 每行一项</label><textarea id="done"></textarea><div id="bindingEditor"></div><div id="stageEditor" hidden><label for="stageMethod">本阶段如何使用专业方法</label><textarea id="stageMethod"></textarea><label>阶段结果与最终交付</label><div id="stageOutputs"></div></div><div id="singleContentEditor"></div><p class="hint">调整能力后，Agent 会重新核验可用条件。依赖和产物检查也会随方案重新核对。</p><p id="editError" class="error-text" role="alert"></p><div class="actions"><button id="applyNode" class="primary">完成编辑</button><button id="remove" class="danger">删除模块</button></div></div></dialog>
 <dialog id="requirementsDialog" aria-labelledby="requirementsTitle"><div class="modal-head"><h2 id="requirementsTitle">需求与交付</h2><button data-close="requirementsDialog" aria-label="关闭需求编辑">×</button></div><div class="modal-body"><label for="ptitle">方案名称</label><input id="ptitle"><label for="pgoal">任务目标</label><textarea id="pgoal"></textarea><div id="requirements"></div><label for="pmode">使用方式</label><select id="pmode"><option value="execute_after_confirmation">确认后执行</option><option value="plan_only">仅供规划参考</option></select><label>预期交付</label><div id="outputs" class="details-list"></div><p id="requirementsError" class="error-text" role="alert"></p><div class="actions"><button id="applyRequirements" class="primary">完成编辑</button></div><details><summary>高级：编辑完整方案</summary><textarea id="raw" rows="12" spellcheck="false" aria-label="完整方案 JSON"></textarea><button id="applyRaw">应用完整方案</button></details></div></dialog>
 <dialog id="outlineDialog" aria-labelledby="outlineTitle"><div class="modal-head"><h2 id="outlineTitle">编辑内容</h2><button data-close="outlineDialog" aria-label="关闭内容编辑">×</button></div><div class="modal-body"><div id="outlineFields"></div><p id="outlineError" class="error-text" role="alert"></p><div class="actions"><button id="applyOutline" class="primary">完成编辑</button><button id="outlineUp">上移</button><button id="outlineDown">下移</button><button id="removeOutline" class="danger">删除内容项</button></div></div></dialog>
 <input id="file" type="file" accept=".json,application/json" hidden>
 <script id="plan-data" type="application/json">__PLAN_DATA__</script>
 <script id="plan-readiness" type="application/json">__PLAN_READINESS__</script>
 <script id="plan-hash" type="text/plain">__PLAN_HASH__</script>
</div>
<script>
(function(){

'use strict';

const root=document.getElementById('sos-root'),$=id=>root.querySelector('#'+id),clone=x=>JSON.parse(JSON.stringify(x));

let base=JSON.parse($('plan-data').textContent),plan=clone(base),selected=plan.nodes[0]?.id,pending=false,removed=[],editingOutline=null;
let serverReadiness=null;try{serverReadiness=JSON.parse($('plan-readiness').textContent)}catch{}

const names={
direct:'原生能力',skill:'调用技能',human:'用户判断'}
,readyNames={
ready:'运行条件已核验',unknown:'执行前进行环境检查',needs_setup:'安装后检查运行条件'}
;

const bridge=()=>typeof window.skillOfSkillsStorage?.save==='function';

function el(tag,text,cls){
let n=document.createElement(tag);
if(text!==undefined)n.textContent=text;
if(cls)n.className=cls;
return n}

function message(text,bad=false){
$('notice').textContent=text;
$('notice').className='notice'+(bad?' error':'')}

function check(p){

 if(!p||typeof p!=='object'||!p.id||!p.title||!p.goal||!Number.isInteger(p.revision)||p.revision<1)throw Error('请补全方案标识、目标和版本');

 if(!['plan_only','execute_after_confirmation'].includes(p.mode))throw Error('请选择有效的使用方式');

 for(const k of ['nodes','requirements','materials','deliverables']){
if(!Array.isArray(p[k]))throw Error(k+' 需要列表');
let ids=p[k].map(x=>x.id);
if(ids.some(x=>typeof x!=='string'||!/^[-\w]+$/.test(x))||new Set(ids).size!==ids.length)throw Error(k+' 标识需要唯一');
}

 if(!p.nodes.length||!p.requirements.length||!p.deliverables.length)throw Error('请保留任务、需求与交付物');

 let ids=new Set(p.nodes.map(n=>n.id)),mats=new Set(p.materials.map(m=>m.id)),producers={
}
,req=new Set(p.requirements.map(r=>r.id)),covered=new Set();

 for(const n of p.nodes){
for(const k of ['depends_on','inputs','outputs','requirements','done_when','bindings','checks'])if(!Array.isArray(n[k]))throw Error(n.id+' 缺少列表 '+k);
if(!names[n.method]||!n.title||!n.description||!n.reason||!n.outputs.length||!n.done_when.length)throw Error(n.id+' 请补全模块内容');
if(n.method==='skill'&&!n.bindings.length)throw Error(n.id+' 请添加技能绑定');
for(const b of n.bindings)if(!b.skill||!b.scope||!b.reason||!b.readiness)throw Error(n.id+' 技能说明不完整');
for(const d of n.depends_on)if(!ids.has(d)||d===n.id)throw Error(n.id+' 前置模块无效');
for(const r of n.requirements){
if(!req.has(r))throw Error('引用了未知需求');
covered.add(r)}
for(const out of n.outputs){
if(producers[out]||mats.has(out))throw Error('产物标识重复');
producers[out]=n.id}
for(const c of n.checks)if(!n.outputs.includes(c.artifact)||!['file','text_contains','csv_columns','pptx_pages','review','native'].includes(c.kind))throw Error(n.id+' 检查规则无效');
if(n.outputs.some(o=>!n.checks.some(c=>c.artifact===o)))throw Error(n.id+' 请为产物添加检查');
}

 function ancestors(id,trail=[]){
if(trail.includes(id))throw Error('依赖关系存在循环');
let a=new Set;
for(const d of p.nodes.find(n=>n.id===id).depends_on){
a.add(d);
for(const x of ancestors(d,[...trail,id]))a.add(x)}
return a}

 for(const n of p.nodes){
let prev=ancestors(n.id);
for(const inp of n.inputs)if(!mats.has(inp)&&!prev.has(producers[inp]))throw Error(n.id+' 输入缺少上游：'+inp)}

 if([...req].some(r=>!covered.has(r)))throw Error('还有需求尚未分配模块');
if(p.deliverables.some(d=>!producers[d.id]))throw Error('交付物缺少负责模块');
const outline=p.content_outline===undefined?[]:p.content_outline;
if(!Array.isArray(outline)||outline.some(o=>!o||typeof o!=='object'||Array.isArray(o)))throw Error('内容蓝图需要对象列表');
const outlineIds=new Set(outline.map(o=>o.id));
if(outlineIds.size!==outline.length)throw Error('内容条目标识需要唯一');
for(const o of outline){
 for(const k of ['id','title','claim','visual'])if(typeof o[k]!=='string'||!o[k].trim())throw Error('请补全内容条目的 '+k);
 if(!/^[A-Za-z0-9_-]+$/.test(o.id))throw Error('内容条目标识需要使用字母、数字、下划线或连字符');
 for(const k of ['points','sources','acceptance'])if(!Array.isArray(o[k])||!o[k].length||o[k].some(x=>typeof x!=='string'||!x.trim()))throw Error(o.title+' 需要具体内容、来源和验收说明');
}
for(const g of [...p.deliverables,...p.nodes])if('outline_ids' in g&&(!Array.isArray(g.outline_ids)||new Set(g.outline_ids).size!==g.outline_ids.length||g.outline_ids.some(id=>!outlineIds.has(id))))throw Error('内容引用缺失或重复');
for(const d of p.deliverables){
 if('outline_level' in d&&!['sections','pages'].includes(d.outline_level))throw Error('outline_level 需要 sections / pages');
 if(d.outline_ids&&!d.outline_ids.length)throw Error('交付物的内容引用需要至少一项');
 const pageChecks=p.nodes.flatMap(n=>n.checks.filter(c=>c.kind==='pptx_pages'&&c.artifact===d.id));
 if((typeof d.format==='string'&&d.format.trim().toLowerCase().replace(/^\./,'')==='pptx')||pageChecks.length){
  if(!d.outline_ids?.length)throw Error('请先列出本次汇报内容');
  if(d.outline_level==='sections'){
   if(new Set(pageChecks.map(c=>c.value)).size>1)throw Error('PPT 页数要求相互冲突');
  }else if(!pageChecks.length||pageChecks.some(c=>c.value!==d.outline_ids.length))throw Error('PPT 页数检查须与逐页内容数量一致');
 }
}


}


function commit(next,errorId){
try{
if(pending)throw Error('正在读取或保存方案，请稍候。');
check(next);
if(next.id!==base.id)throw Error('请选择当前任务的方案或草稿，其他任务请单独打开。');
next.revision=base.revision+1;
delete next.confirmation;
plan=next;
render();
message('有未保存修改。点击顶部“保存修改”写入计划文件。');
return true}
catch(e){
if(errorId)$(errorId).textContent=e.message;
message(e.message,true);
return false}
}

function artifactName(id){
return plan.materials.find(m=>m.id===id)?.title||plan.deliverables.find(d=>d.id===id)?.title||(plan.nodes.find(n=>n.outputs.includes(id))?plan.nodes.find(n=>n.outputs.includes(id)).title+'的产物 ('+id+')':id)}

function nodeOutlineIds(n){
const specific=[...new Set([...plan.deliverables.filter(d=>n.outputs.includes(d.id)).flatMap(d=>d.outline_ids||[]),...(n.outline_ids||[])])];
return specific.length?specific:[...new Set((plan.capability_needs||[]).filter(x=>(n.capability_need_ids||[]).includes(x.id)).flatMap(x=>x.outline_ids||[]))]}

function installationStatus(c,b){
 if(b&&c&&b.skill!==c.name)return {label:'技能已更换',ready:false,detail:'保存后按新技能核对安装情况'};
 if(c?.setup?.status==='available')return {label:'已安装',ready:true,detail:'入口及运行条件已核验'};
 if(c?.origin==='installed')return {label:'已安装',ready:true,detail:'方案已记录本机技能及原文；运行环境检查未完成'};
 if(c?.origin==='external')return {label:'未安装 · '+(c.setup?.status==='approved'?'已授权安装':'需你授权'),ready:false,detail:'已选定专业技能，安装信息见下方'};
 return {label:'安装信息缺失',ready:false,detail:'当前方案没有记录技能安装情况，需补齐环境检查结果'};
}
function skillLink(c){
 const value=c?.acquisition?.catalog_url||c?.source||'';
 try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password?url.href:null}catch{return null}
}
function hideTip(){
 if($('detailDialog').open)$('detailDialog').close();
}

function showTip(n,target){
 const tip=$('tip');tip.replaceChildren();$('detailTitle').textContent=n.title;
 const panels={},tabs=el('div',undefined,'detail-tabs');
 for(const [key,label] of [['work','任务内容'],['skills','技能与安装'],['outputs','交付与检查']]){
  const button=el('button',label);button.dataset.panel=key;button.setAttribute('aria-pressed',key==='work'?'true':'false');
  const panel=el('section',undefined,'detail-panel');panel.id='panel-'+key;panel.hidden=key!=='work';button.setAttribute('aria-controls',panel.id);
  button.onclick=()=>{for(const [id,p] of Object.entries(panels))p.hidden=id!==key;for(const b of tabs.children)b.setAttribute('aria-pressed',String(b===button));};
  tabs.append(button);panels[key]=panel;
 }
 tip.append(tabs,...Object.values(panels));
 const line=(parent,label,value)=>{if(!value)return;const p=el('p');p.append(el('b',label+'：'),document.createTextNode(value));parent.append(p);};
 const list=(parent,label,values)=>{if(!values?.length)return;parent.append(el('h3',label));const ul=el('ul');for(const v of values)ul.append(el('li',v));parent.append(ul);};
 const text=x=>typeof x==='string'?x:JSON.stringify(x);
 line(panels.work,'要完成什么',n.description);
 line(panels.work,'输入材料',n.inputs.map(artifactName).join('、'));
 if(plan.task_route_version===1)line(panels.work,'方法应用',n.stage_method);
 line(panels.work,'先完成',n.depends_on.map(id=>plan.nodes.find(x=>x.id===id)?.title||id).join('、')||'可直接开始本模块');
 if(n.reason&&n.reason!==n.description)line(panels.work,'这样安排的原因',n.reason);
 const ids=nodeOutlineIds(n);

function readiness(){
if(JSON.stringify(plan)!==JSON.stringify(base)||removed.length)return ['unsaved','有未保存修改；保存后按最新范围复核方案。'];
if(serverReadiness)return [serverReadiness.status,serverReadiness.message];
if(plan.profile_policy_version===1)return ['needs_review','请连接保存服务读取最新方案状态。'];
const needs=plan.capability_needs||[];
const unresolved=needs.some(n=>n.task_kind!=='basic'&&(n.decision?.kind!=='skill'||n.decision?.fit!=='supported'));
if(unresolved||(plan.capability_policy_version===3&&!needs.some(n=>n.role==='core')))return ['needs_capability','方案可审阅，专业能力待落实；解决所列问题后再确认执行。'];
if(plan.review_protocol_version===2&&plan.professional_review?.verdict!=='pass')return ['needs_method_review','方案已生成；专业适配待实质审阅，引用核对通过尚不足以确认执行。'];
if(plan.selection_needs_review)return ['needs_review','修改已保存，Agent 需按最新范围复核能力与依赖后执行。'];
if(plan.open_questions?.length)return ['needs_decision','方案可审阅，先解决待确认事项，再执行相关工作。'];
if(plan.mode==='plan_only')return ['plan_only','当前仅供规划参考。'];
const selected=new Set(plan.nodes.flatMap(n=>n.bindings.map(b=>b.candidate_id)));
const pendingInstalls=(plan.capability_candidates||[]).filter(c=>selected.has(c.id)&&c.origin==='external'&&c.setup?.status!=='available');
if(pendingInstalls.some(c=>c.acquisition?.download_bytes==null))return ['needs_installation_details','方案可审阅；候选技能下载大小待核实，补齐提案后再申请具体安装授权。'];
if(pendingInstalls.length)return ['needs_installation_approval','方案可审阅；请先确认列出的具体技能安装提案。普通“按方案执行”不会授权新安装。'];
return ['ready_for_confirmation','请先审阅或修改方案，再在对话中回复“按方案执行”。'];
}

for(const key of Object.keys(plan)){
if(['revision','confirmation','nodes'].includes(key))continue;
if(JSON.stringify(plan[key])!==JSON.stringify(base[key]))c[key]=clone(plan[key])}
let nodes=[];
for(const n of plan.nodes){
if(removed.includes(n.id))continue;
const old=base.nodes.find(x=>x.id===n.id);
if(!old){
nodes.push({
id:n.id,add:n}
);
continue}
let set={
}
;
for(const key of Object.keys(n))if(key!=='id'&&JSON.stringify(n[key])!==JSON.stringify(old[key]))set[key]=clone(n[key]);
if(Object.keys(set).length)nodes.push({
id:n.id,set}
)}
for(const n of base.nodes)if(!plan.nodes.some(x=>x.id===n.id))nodes.push({
id:n.id,remove:true}
);
return {
set:c,nodes}
}

async function persist(){
 if(pending)return;
 if(!bridge()){message('保存未完成：当前 HTML 容器尚未连接计划文件写入服务。页面修改仍在，请勿关闭。',true);return}
 try{
  check(plan);pending=true;render();
  const result=await window.skillOfSkillsStorage.save({action:'update_plan',plan_id:base.id,base_revision:base.revision,base_hash:$('plan-hash').textContent.trim(),changes:changes(),remove_nodes:removed.filter(id=>base.nodes.some(n=>n.id===id))});
  if(!result||result.persisted!==true||!result.plan||!result.hash)throw Error('写入服务未返回保存凭据');
  check(result.plan);
  if(result.plan.id!==base.id||result.plan.revision<base.revision)throw Error('保存返回了不匹配的计划版本');
  base=clone(result.plan);plan=clone(base);removed=[];serverReadiness=result.readiness||null;$('plan-hash').textContent=result.hash;
  pending=false;render();message('已保存 v'+base.revision+'。'+readiness()[1]);
 }catch(e){pending=false;render();message('保存未完成：'+e.message,true)}
}
$('persist').onclick=persist;

function openOutline(id){
 if(pending)return;hideTip();editingOutline=id;
 const item=plan.content_outline.find(x=>x.id===id);
 $('outlineTitle').textContent='编辑内容 · '+item.title;$('outlineError').textContent='';
 $('outlineFields').replaceChildren();
 for(const [key,label] of [['title','标题'],['claim','核心判断或待回答问题'],['points','具体内容 · 每行一项'],['sources','材料来源 · 每行一项'],['visual','组织与呈现方式'],['acceptance','验收标准 · 每行一项']]){
  const l=el('label',label),f=el('textarea');f.dataset.field=key;f.value=Array.isArray(item[key])?item[key].join('\n'):item[key];l.append(f);$('outlineFields').append(l);
 }
 $('outlineDialog').showModal();
}
function editedOutline(){
 const p=clone(plan),item=p.content_outline.find(x=>x.id===editingOutline);
 for(const f of $('outlineFields').querySelectorAll('textarea')){
  const key=f.dataset.field,value=f.value.trim();if(!value)throw Error('请补全标题、问题或判断、内容、来源、组织方式和验收要求');
  item[key]=['points','sources','acceptance'].includes(key)?value.split('\n').map(x=>x.trim()).filter(Boolean):value;
 }
 return p;
}
$('applyOutline').onclick=()=>{try{if(commit(editedOutline(),'outlineError'))$('outlineDialog').close()}catch(e){$('outlineError').textContent=e.message}};
function moveOutline(delta){
 try{
 const p=editedOutline();
 for(const group of [...p.deliverables,...p.nodes]){const ids=group.outline_ids;if(!ids)continue;const i=ids.indexOf(editingOutline),j=i+delta;if(i>=0&&j>=0&&j<ids.length)[ids[i],ids[j]]=[ids[j],ids[i]]}
 if(commit(p,'outlineError'))$('outlineDialog').close();
 }catch(e){$('outlineError').textContent=e.message}
}
$('outlineUp').onclick=()=>moveOutline(-1);$('outlineDown').onclick=()=>moveOutline(1);
$('removeOutline').onclick=()=>{
 const p=clone(plan);
 if(p.deliverables.some(d=>d.outline_ids?.includes(editingOutline)&&d.outline_ids.length===1)){$('outlineError').textContent='请至少保留一个内容项';return}
 p.content_outline=p.content_outline.filter(x=>x.id!==editingOutline);
 for(const g of [...p.deliverables,...p.nodes])if(g.outline_ids)g.outline_ids=g.outline_ids.filter(id=>id!==editingOutline);
 for(const n of p.nodes)for(const c of n.checks)if(c.kind==='pptx_pages'){const d=p.deliverables.find(d=>d.id===c.artifact);if(d?.outline_ids&&d.outline_level!=='sections')c.value=d.outline_ids.length}
 if(commit(p,'outlineError'))$('outlineDialog').close();
};

$('add').onclick=()=>{
let p=clone(plan),i=1;
while([...p.nodes,...base.nodes].some(n=>n.id==='N'+i)||p.materials.some(m=>m.id==='note'+i)||p.nodes.some(n=>n.outputs.includes('note'+i)))i++;
let id='N'+i;
if(p.task_route_version===1){
 const original=p.nodes.find(n=>n.id===selected)||p.nodes[0],n=clone(original),oid='D'+i+'_1',rid='R'+i,bid='B'+i,needid='need-'+i;
 n.id=id;n.title=original.title+' · 副本';n.outputs=[oid];n.requirements=[rid];n.outline_ids=[bid];n.capability_need_ids=[needid];n.bindings.forEach(b=>{b.readiness='unknown';if(b.contract)delete b.contract.verification});
 n.checks=[{id:id+'-review-1',kind:'review',artifact:oid,criteria:n.done_when.join('；')}];
 for(const b of n.bindings)if(b.contract){b.contract.inputs=[...n.inputs];b.contract.outputs=[oid];b.contract.required_checks=clone(n.checks);}
 p.requirements.push({id:rid,text:n.description});p.content_outline.push({id:bid,title:n.title,claim:n.description,points:[n.description],sources:n.inputs,visual:n.stage_method,acceptance:n.done_when});
 p.deliverables.push({id:oid,title:'新增阶段'+i+'.md',description:n.description,format:'md',outline_ids:[bid],outline_level:'sections',delivery_role:'final'});p.nodes.push(n);
 if(commit(p))openNode(id);return;
}
p.nodes.push({
id,title:'新增工作',description:'填写本模块处理的具体对象、方法和输出。',reason:'填写这项工作对交付的作用。',method:'direct',depends_on:[],inputs:[],outputs:['note'+i],requirements:[],done_when:['形成检查记录'],checks:[{
kind:'review',artifact:'note'+i,id:'review-'+id,criteria:'对照模块完成标准核对实际产物并记录差异'}
],bindings:[]}
);
if(commit(p))openNode(id)}
;

$('moreButton').onclick=()=>{
$('extraTools').hidden=!$('extraTools').hidden}
;
for(const b of root.querySelectorAll('[data-close]'))b.onclick=()=>$(b.dataset.close).close();


$('save').onclick=()=>{
const draft={type:'sos-editor-draft',plan,removed,base_hash:$('plan-hash').textContent.trim(),base_revision:base.revision};
let url=URL.createObjectURL(new Blob([JSON.stringify(draft,null,2)],{
type:'application/json'}
)),a=el('a');
a.href=url;
a.download=plan.id+'-draft-v'+base.revision+'.json';
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000)}
;

$('print').onclick=()=>window.print();
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{
try{
let x=JSON.parse(await e.target.files[0].text());
if(x.type==='sos-editor-draft'){
 if(x.base_hash!==$('plan-hash').textContent.trim()||x.base_revision!==base.revision)throw Error('备份基于旧版本；请先核对当前方案并合并修改。');
 if(!Array.isArray(x.removed)||x.removed.some(id=>!x.plan.nodes.some(n=>n.id===id))||new Set(x.removed).size!==x.removed.length)throw Error('草稿删除标记无效');
 if(commit(x.plan)){removed=x.removed;render();}
}else if(commit(x.type==='execution_request'?x.plan:x)){removed=[];render();}}
catch(err){
message('导入失败：'+err.message,true)}
e.target.value=''}
;

window.addEventListener('resize',()=>{
requestAnimationFrame(draw)}
);

check(plan);
render();
if(typeof window.skillOfSkillsStorage?.load==='function'){
 pending=true;render();
 window.skillOfSkillsStorage.load().then(result=>{
  check(result.plan);
  if(result.plan.id!==base.id||!result.hash)throw Error('计划标识不匹配');
  base=clone(result.plan);plan=clone(base);serverReadiness=result.readiness||null;$('plan-hash').textContent=result.hash;
  pending=false;render();message('已读取最新保存版本 v'+base.revision+'。');
 }).catch(e=>{pending=false;render();message('读取最新版本失败：'+e.message,true)});
}

}
)();

</script>
